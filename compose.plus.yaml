# Overlay: Kepler Geospatial Maps Plus, a local build of the closed-source
# keplergl-grafana-plus-panel repo, mounted beside the baked plugins. Never
# baked into the published images.
#
#   PLUS_DIST=../keplergl-grafana-plus-panel/dist docker compose -f compose.yaml -f compose.plus.yaml up --wait
#
# Or, to keep it on with a plain `docker compose up`, in .env:
#   PLUS_DIST=../keplergl-grafana-plus-panel/dist
#   COMPOSE_FILE=compose.yaml:compose.plus.yaml
#
# PLUS_DIST is required: a bind mount of a path that does not exist would
# mount an empty folder, and the app would silently disappear.
#
# The Plus dashboards come from the `plus` Git Sync repository
# (plus/repositories/), synced with plus/dashboards/. Without this overlay,
# start.sh deletes that repository, and the Plus folder goes with it.
services:
  grafana:
    environment:
      # Replaces the image's list (see images/grafana/Dockerfile): repeat it,
      # plus the app and the panel it nests.
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: ubica-keplergl-panel,ubica-chaski-datasource,motherduck-duckdb-datasource,ubica-keplerplus-app,ubica-keplerplus-panel,ubica-timebrush-panel
    volumes:
      - type: bind
        source: ${PLUS_DIST:?set PLUS_DIST to the Plus app's dist/ folder}
        target: /opt/pacha/plugins/ubica-keplerplus-app
        read_only: true
      - type: bind
        source: ./plus/provisioning-plugins
        target: /etc/grafana/provisioning/plugins
        read_only: true
      # The plus Repository; without this mount, start.sh deletes it.
      - type: bind
        source: ./plus/repositories
        target: /etc/grafana/provisioning/repositories/plus
        read_only: true
      # Read-write: Git Sync writes saves back here. See scripts/dev-acl.sh.
      - type: bind
        source: ./plus/dashboards
        target: /var/lib/pacha/plus-dashboards
