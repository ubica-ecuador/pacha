# `feeds`: the MBTA feeds behind gtfs-rt-mbta, cached. DuckDB in the grafana
# container calls http://feeds/mbta/..., and the gateway answers that name
# through a network alias.
#
# Every panel of that dashboard fetches a feed on every 30 s refresh, for every
# visitor, and MBTA's developer licence asks for no more than one request every
# 10 s. A 15 s cache makes the upstream rate independent of the audience.

proxy_cache_path /var/cache/nginx/mbta levels=1:2 keys_zone=mbta:10m
                 max_size=200m inactive=2h use_temp_path=off;

server {
    listen 80;
    server_name feeds;

    # Internal only. A request relayed by the public proxy also arrives from a
    # private address, but it carries X-Forwarded-For.
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;
    if ($http_x_forwarded_for) {
        return 403;
    }

    resolver 127.0.0.11 valid=300s ipv6=off;

    proxy_cache mbta;
    proxy_cache_key $uri;
    # Concurrent misses wait for one upstream fetch instead of each making one.
    proxy_cache_lock on;
    # No stale copies at all, not even while MBTA is failing: the dashboard
    # measures how fresh the feed is, and a stale copy would misreport exactly
    # that.
    proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
    proxy_hide_header Set-Cookie;
    proxy_ssl_server_name on;
    # The cache key ignores Accept-Encoding, so upstream must always answer
    # uncompressed; otherwise one gzip-accepting client would poison the entry.
    proxy_set_header Accept-Encoding "";
    # DuckDB reads Parquet with range requests; serve them from the cached file.
    proxy_force_ranges on;

    # Real-time feeds: VehiclePositions, TripUpdates and Alerts, as .pb or .json.
    location ~ ^/mbta/realtime/([A-Za-z_]+\.(json|pb))$ {
        set $mbta_rt cdn.mbta.com;
        proxy_pass https://$mbta_rt/realtime/$1;
        proxy_set_header Host $mbta_rt;
        proxy_cache_valid 200 15s;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # LAMP performance archive: one Parquet per service day, rewritten during
    # the day and again a day or two later, so an hour is fresh enough.
    location ~ ^/mbta/lamp/([A-Za-z0-9_./-]+\.(parquet|csv))$ {
        set $mbta_lamp performancedata.mbta.com;
        proxy_pass https://$mbta_lamp/lamp/$1;
        proxy_set_header Host $mbta_lamp;
        proxy_cache_valid 200 1h;
        add_header X-Cache-Status $upstream_cache_status always;
    }
}
