# `feeds`: the MBTA feeds behind gtfs-rt-mbta-fleet, cached. DuckDB in the grafana
# container calls http://feeds/mbta/..., and the gateway answers that name
# through a network alias.
#
# Every panel of that dashboard fetches a feed on every 30 s refresh, for every
# visitor, and MBTA's developer licence asks for no more than one request every
# 10 s. A 15 s cache makes the upstream rate independent of the audience.
#
# Also the European grid behind european-power-grid: Energy-Charts (Fraunhofer
# ISE) and the PyPSA-Eur network on Zenodo. Energy-Charts answers 503 to the
# Host header DuckDB sends (it carries the port); the proxy sends a plain one.
#
# And CMU's drone flights on figshare, whose redirect DuckDB cannot cache.
#
# And TriMet (Portland), behind trimet-live-fleet, whose every call needs an
# AppID in the query string. This is where it is added, so no dashboard carries
# it: not in git, and not in the query inspector of a public instance. It comes
# from TRIMET_APP_ID in .env; the nginx image runs envsubst over
# /etc/nginx/templates when the container starts, which is why this file is
# mounted there and not in conf.d. NGINX_ENVSUBST_FILTER limits it to
# TRIMET_*, so nginx's own variables stay as they are.
#
# And adsb.lol, behind air-traffic-world: every aircraft in the world in one
# answer, about 6,000 of them, 3.6 MB plain and 850 KB gzipped. A community
# service with no key; asked once a minute at most, whoever is looking, and the
# recorder (compose profile `recorder`) reads this same copy.
#
# And NOAA's GFS forecast on ERDDAP, behind gfs-wind-synoptic. ERDDAP builds
# every answer on the spot, in anything from 2 s to minutes, and DuckDB asks
# twice -- a HEAD, then the GET -- each built in full. The dashboard writes its
# time window into the URL from the clock, so one URL stands for three hours;
# cached here, ERDDAP is asked once per window, whoever is looking.
#
# And NYC's buildings and subway, behind nyc-skyline-plus, exported from a
# public GeoLens catalogue. The export is built per request, with a new ETag
# each time, so DuckDB's reads of one Parquet would abort with "the remote
# file has changed". Cached here, they all read the same file. It comes
# chunked, with no length, so nginx serves it whole, not by ranges; DuckDB
# then downloads it once, at most 4 MB.
#
# And the IMF's PortWatch and FRED, behind shipping-chokepoints-freight.
# PortWatch's daily transits are one 9 MB CSV, rebuilt once a week: cached, it
# is downloaded once a day, not once a visit. FRED refuses DuckDB, on its site
# and on its API alike (DuckDB's HEAD before the GET); through here it is one
# GET with the key from FRED_API_KEY in .env, added like TriMet's AppID.
#
# And Luchtmeetnet, the Dutch air quality network, behind
# air-quality-amsterdam: one request per station and pollutant, for whole
# hours, so every visitor in the same hour shares one copy.
#
# And Caltrans, behind caltrans-la-cameras: its District 7 cameras, message
# signs and lane closures. No key, but the closures are one 14 MB file, and
# every dataset reloads on every refresh, for every visitor.
#
# And the City of Melbourne's open data, behind melbourne-city-sensors: its
# parking bay sensors, pedestrian counters and microclimate stations, as
# Parquet from its Opendatasoft portal. No key, but each export is built per
# request, in one to four seconds, and every panel reads it on every refresh.
#
# And the open register of the Internet's interconnection, behind
# datacenter-interconnection: PeeringDB's data centres, TeleGeography's
# submarine cables and RIPE Atlas's anchors with their ping mesh. No key, but
# PeeringDB lets an anonymous client have a whole list once an hour, and
# answers 429, for the next hour, to a second ask. Its data centres change a
# few times a day: they are asked once a day, and a copy past its day is
# served while PeeringDB refuses.
#
# And CelesTrak, behind starlink-constellation: the orbital elements of every
# Starlink satellite, one 1.7 MB CSV. No key, but CelesTrak updates them every
# two hours or so and blocks a client that downloads the same data twice in
# that time: kept two hours, it is asked once per update, whoever is looking.
#
# And the fires near the grid, behind wildfires-power-grid: NASA FIRMS's
# active fires from the three VIIRS satellites, a week per region. The grid
# itself is a file each instance builds once (datasets/power-grid).
#
# And the Danish Maritime Authority's AIS, behind denmark-ais-trajectories:
# every ship its network heard, a day per file. The recorder reads each day
# once into the tables the dashboard reads, so the files pass through, uncached.
#
# And the animal tracks behind animal-movement-tracking: INBO's lesser
# black-backed gulls and the Jaguar Movement Database, both published on
# Zenodo, and the Stanford Block Lab's ocean predators (TOPP) from the Animal
# Telemetry Network's ERDDAP. No key, but they are published files, 2 to 100 MB
# each, that never change; Zenodo takes up to a minute to start sending a big
# one, and ERDDAP half a minute to build the TOPP tracks.
#
# And Spain's Ministry of Transport (MITMA), behind spain-mobility-mitma: its
# open mobility study from mobile phones, read from the ministry's public S3
# bucket; the ministry's own web site refuses this server. No key, but a day of
# trips between municipalities is one 80 MB gzipped CSV, 14 million rows, and
# a published day never changes: kept a month, it is downloaded once, however
# many panels and visitors read it.
#
# And OpenF1, behind f1-race-laps: every Formula 1 session since 2023, its
# laps, tyres, pit stops, race control, and the cars' positions and telemetry
# about four times a second. No key for the history, but OpenF1 lets a free
# client make 3 requests a second and 30 a minute. A session that is over never
# changes, so its answers are kept a month; and every request that does reach
# OpenF1 waits its turn at a second server below, which lets through 25 a
# minute however many panels and visitors miss the cache at once.
#
# And the IOC's Sea Level Station Monitoring Facility (VLIZ), behind
# mareas-ecuador: the raw readings of every tide gauge in the Americas, about
# 360 of them, one request per station (the API takes one code at a time). No
# key for its v1 service. Read per visit, that is 360 requests and more than
# the 30 s a Grafana query may take; so each station is kept under its code
# and sensor alone, whatever window the URL asks for, refreshed in the
# background once it is a quarter of an hour old while the visitor gets the
# copy already here. Requests that do reach the IOC go through a second server
# below, ten a second.

proxy_cache_path /var/cache/nginx/mbta levels=1:2 keys_zone=mbta:10m
                 max_size=200m inactive=2h use_temp_path=off;
proxy_cache_path /var/cache/nginx/trimet levels=1:2 keys_zone=trimet:10m
                 max_size=200m inactive=2h use_temp_path=off;
map $args $trimet_args {
    ''      'appID=${TRIMET_APP_ID}';
    default 'appID=${TRIMET_APP_ID}&$args';
}
proxy_cache_path /var/cache/nginx/adsblol levels=1:2 keys_zone=adsblol:10m
                 max_size=100m inactive=1h use_temp_path=off;
proxy_cache_path /var/cache/nginx/grid levels=1:2 keys_zone=grid:10m
                 max_size=200m inactive=7d use_temp_path=off;
proxy_cache_path /var/cache/nginx/erddap levels=1:2 keys_zone=erddap:10m
                 max_size=1g inactive=6h use_temp_path=off;
proxy_cache_path /var/cache/nginx/drones levels=1:2 keys_zone=drones:10m
                 max_size=500m inactive=30d use_temp_path=off;
proxy_cache_path /var/cache/nginx/geolens levels=1:2 keys_zone=geolens:10m
                 max_size=200m inactive=30d use_temp_path=off;
proxy_cache_path /var/cache/nginx/shipping levels=1:2 keys_zone=shipping:10m
                 max_size=100m inactive=7d use_temp_path=off;
proxy_cache_path /var/cache/nginx/luchtmeetnet levels=1:2 keys_zone=luchtmeetnet:10m
                 max_size=100m inactive=1d use_temp_path=off;
proxy_cache_path /var/cache/nginx/caltrans levels=1:2 keys_zone=caltrans:10m
                 max_size=200m inactive=1h use_temp_path=off;
proxy_cache_path /var/cache/nginx/melbourne levels=1:2 keys_zone=melbourne:10m
                 max_size=200m inactive=1d use_temp_path=off;
proxy_cache_path /var/cache/nginx/interconnection levels=1:2 keys_zone=interconnection:10m
                 max_size=200m inactive=7d use_temp_path=off;
proxy_cache_path /var/cache/nginx/celestrak levels=1:2 keys_zone=celestrak:1m
                 max_size=20m inactive=7d use_temp_path=off;
proxy_cache_path /var/cache/nginx/wildfires levels=1:2 keys_zone=wildfires:10m
                 max_size=500m inactive=60d use_temp_path=off;
proxy_cache_path /var/cache/nginx/wildlife levels=1:2 keys_zone=wildlife:10m
                 max_size=500m inactive=30d use_temp_path=off;
proxy_cache_path /var/cache/nginx/mitma levels=1:2 keys_zone=mitma:10m
                 max_size=2g inactive=30d use_temp_path=off;
proxy_cache_path /var/cache/nginx/openf1 levels=1:2 keys_zone=openf1:10m
                 max_size=1g inactive=30d use_temp_path=off;
map $host $openf1_bucket {
    default openf1;
}
limit_req_zone $openf1_bucket zone=openf1_upstream:1m rate=25r/m;
proxy_cache_path /var/cache/nginx/ioc levels=1:2 keys_zone=ioc:10m
                 max_size=500m inactive=7d use_temp_path=off;
map $host $ioc_bucket {
    default ioc;
}
limit_req_zone $ioc_bucket zone=ioc_upstream:1m rate=10r/s;
proxy_cache_path /var/cache/nginx/r5 levels=1:2 keys_zone=r5:10m
                 max_size=2g inactive=30d use_temp_path=off;
map $host $r5_bucket {
    default r5;
}
limit_req_zone $r5_bucket zone=r5_upstream:1m rate=120r/m;
proxy_cache_path /var/cache/nginx/lulc levels=1:2 keys_zone=lulc:10m
                 max_size=2g inactive=30d use_temp_path=off;
proxy_cache_path /var/cache/nginx/gdacs levels=1:2 keys_zone=gdacs:1m
                 max_size=200m inactive=7d use_temp_path=off;

server {
    listen 80;
    server_name feeds;

    # Internal only. A request relayed by the public proxy also arrives from a
    # private address, but it carries X-Forwarded-For.
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;
    if ($http_x_forwarded_for) {
        return 403;
    }

    resolver 127.0.0.11 valid=300s ipv6=off;

    proxy_cache mbta;
    proxy_cache_key $uri;
    # Concurrent misses wait for one upstream fetch instead of each making one.
    proxy_cache_lock on;
    # No stale copies at all, not even while MBTA is failing: the dashboard
    # measures how fresh the feed is, and a stale copy would misreport exactly
    # that.
    proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
    proxy_hide_header Set-Cookie;
    proxy_ssl_server_name on;
    # The cache key ignores Accept-Encoding, so upstream must always answer
    # uncompressed; otherwise one gzip-accepting client would poison the entry.
    proxy_set_header Accept-Encoding "";
    # DuckDB reads Parquet with range requests; serve them from the cached file.
    proxy_force_ranges on;

    # Real-time feeds: VehiclePositions, TripUpdates and Alerts, as .pb or .json.
    location ~ ^/mbta/realtime/([A-Za-z_]+\.(json|pb))$ {
        set $mbta_rt cdn.mbta.com;
        proxy_pass https://$mbta_rt/realtime/$1;
        proxy_set_header Host $mbta_rt;
        proxy_cache_valid 200 15s;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # TriMet's web services, v2 and V1, with the AppID added. Always asked for
    # gzip, and stored that way: the trip status feed is 11 MB plain and 1 MB
    # gzipped. gunzip hands it plain to a client that does not ask for gzip,
    # as DuckDB's http_get does not. Kept 15 s: one fetch per dashboard
    # refresh, however many datasets and visitors ask. The key is the path and
    # query as the dashboard sent them, without the AppID.
    location ~ ^/trimet/(ws/(?:v2|V1)/[A-Za-z]+)$ {
        set $trimet developer.trimet.org;
        proxy_pass https://$trimet/$1?$trimet_args;
        proxy_set_header Host $trimet;
        proxy_set_header Accept-Encoding gzip;
        gunzip on;
        proxy_cache trimet;
        proxy_cache_key $request_uri;
        proxy_cache_valid 200 15s;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # adsb.lol: every aircraft in the world, the widest circle its API takes.
    # Asked for gzip and stored that way, like TriMet. Kept 55 s, not 60: the
    # recorder polls on the minute, and a copy it fetched a minute earlier
    # (stored a second or so after the minute) would still be fresh, so every
    # other poll would get the same snapshot again. Still at most one request a
    # minute to adsb.lol, near enough.
    location = /adsblol/world {
        set $adsblol api.adsb.lol;
        proxy_pass https://$adsblol/v2/lat/0/lon/0/dist/20000;
        # Its envoy answers nginx's default HTTP/1.0 with 426 Upgrade Required.
        proxy_http_version 1.1;
        proxy_set_header Host $adsblol;
        proxy_set_header User-Agent "Pacha (+https://github.com/ubica-ecuador/pacha)";
        proxy_set_header Accept-Encoding gzip;
        gunzip on;
        proxy_cache adsblol;
        proxy_cache_valid 200 55s;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # The Danish Maritime Authority's AIS, a day at a time: one zipped CSV of
    # about 650 MB, two or three days late. Only the recorder's ais-denmark feed
    # reads it, once per day, so it is streamed through and never cached. The
    # bucket by path: its dotted name does not match S3's certificate.
    location ~ "^/dma-ais/(aisdk-[0-9]{4}-[0-9]{2}-[0-9]{2}\.zip)$" {
        set $dma_ais s3.eu-central-1.amazonaws.com;
        proxy_pass https://$dma_ais/aisdata.ais.dk/$1;
        proxy_set_header Host $dma_ais;
        proxy_cache off;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # What the recorder keeps (compose profile `recorder`): Parquet and a
    # manifest, from the recordings volume. Grafana's DuckDB cannot read local
    # files, so it reads them here. Static, by ranges, never cached: the
    # manifest changes every minute. A file being written has a .tmp name and
    # is never served. With nothing recorded, the repo's gateway/recordings/:
    # a manifest naming one empty file, so history panels show no rows.
    location /recordings/ {
        root /srv;
        add_header Cache-Control no-cache always;
        location ~ \.tmp$ {
            return 404;
        }
        try_files $uri /fallback$uri =404;
    }
    location /fallback/ {
        internal;
        root /srv;
        add_header Cache-Control no-cache always;
    }

    # Datasets built on this instance from sources that may not be published
    # as they are (datasets/<name>/build.sh): Parquet only, by ranges, for
    # Grafana's DuckDB; this server answers no browser. A rebuild replaces
    # each file by a rename, so they are not cached by anyone.
    location ~ "^/datasets/[a-z0-9-]+/[a-z0-9_-]+\.parquet$" {
        root /srv;
        add_header Cache-Control no-cache always;
    }

    # LAMP performance archive: one Parquet per service day, rewritten during
    # the day and again a day or two later, so an hour is fresh enough.
    location ~ ^/mbta/lamp/([A-Za-z0-9_./-]+\.(parquet|csv))$ {
        set $mbta_lamp performancedata.mbta.com;
        proxy_pass https://$mbta_lamp/lamp/$1;
        proxy_set_header Host $mbta_lamp;
        proxy_cache_valid 200 1h;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # Energy-Charts: Germany's borders and the countries around it. The public
    # API allows 2 requests a minute per endpoint (a burst of 4; /signal 20),
    # so each endpoint is asked once a cache period, whatever the audience.
    # Its data comes in 15 min steps. The query string picks country and
    # days, so it is part of the key. No stale copies, as for MBTA: when a
    # reload fails, Chaski keeps the last good rows and says how old they are.
    location ~ ^/energy-charts/(v2/(cbpf|cbet|public_power|price|signal))$ {
        set $energy_charts api.energy-charts.info;
        proxy_pass https://$energy_charts/$1$is_args$args;
        proxy_set_header Host $energy_charts;
        proxy_cache grid;
        proxy_cache_key $request_uri;
        proxy_cache_valid 200 10m;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # Grid frequency, one reading a second: a minute's cache, within the limit.
    location = /energy-charts/v2/frequency {
        set $energy_charts api.energy-charts.info;
        proxy_pass https://$energy_charts/v2/frequency$is_args$args;
        proxy_set_header Host $energy_charts;
        proxy_cache grid;
        proxy_cache_key $request_uri;
        proxy_cache_valid 200 1m;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # PyPSA-Eur's prebuilt network: a versioned Zenodo record never changes.
    location ~ ^/zenodo/records/([0-9]+)/files/([A-Za-z0-9_.-]+\.csv)$ {
        set $zenodo zenodo.org;
        proxy_pass https://$zenodo/api/records/$1/files/$2/content;
        proxy_set_header Host $zenodo;
        proxy_cache grid;
        proxy_cache_valid 200 7d;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # CMU's package-delivery drone flights behind drone-delivery-flights, on
    # figshare (KiltHub). A file id never changes, so a month's cache. Figshare
    # answers with a redirect to an S3 link signed for 10 s: the gateway follows
    # it itself and stores the file under the figshare address ($uri), so the
    # next request is a HIT here and never sees the redirect.
    location ~ ^/figshare/files/([0-9]+)$ {
        set $figshare ndownloader.figshare.com;
        proxy_pass https://$figshare/files/$1;
        proxy_set_header Host $figshare;
        proxy_cache drones;
        proxy_cache_valid 200 30d;
        proxy_intercept_errors on;
        error_page 301 302 307 = @figshare_signed;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    location @figshare_signed {
        set $signed $upstream_http_location;
        proxy_pass $signed;
        proxy_cache drones;
        proxy_cache_valid 200 30d;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # ERDDAP griddap (PacIOOS's copy of NCEP GFS), query string and all: the
    # hours and the box are in it.
    location ^~ /erddap/ {
        set $erddap pae-paha.pacioos.hawaii.edu;
        # $request_uri as it arrived, still percent-encoded: ERDDAP wants its
        # brackets as %5B/%5D, and a decoded copy would not be the same URL.
        proxy_pass https://$erddap$request_uri;
        proxy_set_header Host $erddap;
        proxy_cache erddap;
        proxy_cache_key $request_uri;
        # A forecast step's values change only when a new run lands, every six
        # hours, and the dashboard's URLs move on every three anyway.
        proxy_cache_valid 200 3h;
        # A slow answer is still worth keeping: if Grafana gives up on it, the
        # fetch carries on and the next visitor finds it here.
        proxy_ignore_client_abort on;
        proxy_read_timeout 600s;
        # Concurrent misses -- DuckDB's HEAD and GET, two panels, two visitors --
        # wait for the one fetch in flight, for as long as ERDDAP can take,
        # rather than the default 5 s after which each goes upstream itself.
        proxy_cache_lock_timeout 600s;
        proxy_cache_lock_age 600s;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # The El Niño service behind enso-ecuador: Parquet artefacts it rebuilds
    # every day from INAMHI, NOAA and others. It is a container named `elnino`
    # on a network the gateway shares only where that service runs (on
    # pacha.ubica.dev, ubica_network); elsewhere the name does not resolve and
    # this answers 502. Not cached: it is on the same host, and a cached file
    # would outlive the day's rebuild.
    location ^~ /elnino/ {
        set $elnino elnino;
        rewrite ^/elnino/(.*)$ /$1 break;
        proxy_pass http://$elnino;
        proxy_cache off;
    }

    # Cuenca's travel times behind cuenca-accessibility: iso-cuenca, a bridge
    # that asks the R5 instance of Cuenca (Conveyal) for the travel-time surface
    # from an origin and serves it as cells, isochrones and an accessibility
    # curve. Like elnino it is a container on ubica_network, which the gateway
    # shares only on pacha.ubica.dev; elsewhere this answers 502. Only its GET
    # endpoints: the service keeps each surface on disk, and this keeps the
    # answers a month, keyed by the whole query string, so a second visit to an
    # origin never reaches R5. Anyone viewing a dashboard can send SQL to
    # DuckDB, so a miss costs an R5 computation (about a second): every request,
    # cached or not, is held to two a second with a burst of sixty, which a
    # visit (a few requests for each of two origins) never meets.
    location ~ ^/r5/(cells\.json|iso\.geojson|accessibility\.json|health)$ {
        set $iso_cuenca iso-cuenca:8099;
        limit_req zone=r5_upstream burst=60 nodelay;
        proxy_pass http://$iso_cuenca/$1$is_args$args;
        proxy_cache r5;
        proxy_cache_key $request_uri;
        proxy_cache_valid 200 30d;
        proxy_read_timeout 60s;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # GeoLens dataset exports, by dataset id, as Parquet. The data behind an id
    # is a published snapshot, so a week's cache; a stranger's demo instance,
    # though, so not a month.
    location ~ "^/geolens/datasets/([0-9a-f-]{36})\.parquet$" {
        set $geolens datasets.geolibre.app;
        proxy_pass https://$geolens/api/datasets/$1/export?format=parquet;
        proxy_set_header Host $geolens;
        proxy_cache geolens;
        proxy_cache_valid 200 7d;
        proxy_read_timeout 120s;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # PortWatch datasets as CSV, by ArcGIS Hub item id, from the address the
    # Hub's download link redirects to. Rebuilt weekly, so a day's cache.
    location ~ "^/portwatch/items/([0-9a-f]{32})\.csv$" {
        set $arcgis_hub hub.arcgis.com;
        proxy_pass https://$arcgis_hub/api/v3/datasets/$1_0/downloads/data?format=csv&spatialRefId=4326&where=1%3D1;
        proxy_set_header Host $arcgis_hub;
        proxy_cache shipping;
        proxy_cache_valid 200 1d;
        proxy_read_timeout 120s;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # FRED series, observations as JSON, by series id. A BLS price index gains
    # one value a month, so a day's cache. The cache key is the path, without
    # the api_key, so the API key never reaches a cache entry or a dashboard.
    location ~ ^/fred/series/([A-Z0-9]+)$ {
        set $fred api.stlouisfed.org;
        proxy_pass https://$fred/fred/series/observations?series_id=$1&file_type=json&api_key=${FRED_API_KEY};
        proxy_set_header Host $fred;
        proxy_cache shipping;
        proxy_cache_valid 200 1d;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # Luchtmeetnet's hourly measurements, query string and all: station,
    # pollutant and hours are in it. The dashboard asks for whole hours, so a
    # URL stands for an hour; an hour's readings land within about an hour of
    # its end, so 10 minutes. Only a 200 is kept: past 7 days the API answers
    # with a redirect to a shorter span, which the dashboard never asks for.
    location = /luchtmeetnet/measurements {
        set $luchtmeetnet api.luchtmeetnet.nl;
        proxy_pass https://$luchtmeetnet/open_api/measurements$is_args$args;
        proxy_set_header Host $luchtmeetnet;
        proxy_cache luchtmeetnet;
        proxy_cache_key $request_uri;
        proxy_cache_valid 200 10m;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # Caltrans' status files for District 7 (Los Angeles): cameras and
    # message signs, kept a minute; lane closures, 14 MB, kept five. Caltrans
    # rewrites the signs and the closures every few minutes. Only the JSON:
    # the images and the video go straight from Caltrans to the browser,
    # which may fetch them (CORS *).
    location ~ ^/caltrans/(d7/(?:cctv|cms)/[a-zA-Z0-9]+\.json)$ {
        set $caltrans cwwp2.dot.ca.gov;
        proxy_pass https://$caltrans/data/$1;
        proxy_set_header Host $caltrans;
        proxy_cache caltrans;
        proxy_cache_valid 200 1m;
        add_header X-Cache-Status $upstream_cache_status always;
    }
    location ~ ^/caltrans/(d7/lcs/[a-zA-Z0-9]+\.json)$ {
        set $caltrans cwwp2.dot.ca.gov;
        proxy_pass https://$caltrans/data/$1;
        proxy_set_header Host $caltrans;
        proxy_cache caltrans;
        proxy_cache_valid 200 5m;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # City of Melbourne datasets as Parquet, by dataset id, with the export's
    # own query string (select, where): the dashboard asks for whole hours or
    # days, so one URL stands for a while. Opendatasoft builds the export per
    # request, chunked, with no length, so nginx serves it whole and DuckDB
    # downloads it once. Kept as long as it can change: the parking sensors
    # and the microclimate stations two minutes; the pedestrian counts,
    # loaded once a day, an hour; the places of the sensors, the bays and the
    # parking zones, a day.
    location ~ ^/melbourne/(on-street-parking-bay-sensors|microclimate-sensors-data)\.parquet$ {
        set $melbourne data.melbourne.vic.gov.au;
        proxy_pass https://$melbourne/api/explore/v2.1/catalog/datasets/$1/exports/parquet$is_args$args;
        proxy_set_header Host $melbourne;
        proxy_cache melbourne;
        proxy_cache_key $request_uri;
        proxy_cache_valid 200 2m;
        add_header X-Cache-Status $upstream_cache_status always;
    }
    location ~ ^/melbourne/(pedestrian-counting-system-monthly-counts-per-hour)\.parquet$ {
        set $melbourne data.melbourne.vic.gov.au;
        proxy_pass https://$melbourne/api/explore/v2.1/catalog/datasets/$1/exports/parquet$is_args$args;
        proxy_set_header Host $melbourne;
        proxy_cache melbourne;
        proxy_cache_key $request_uri;
        proxy_cache_valid 200 1h;
        proxy_read_timeout 120s;
        add_header X-Cache-Status $upstream_cache_status always;
    }
    location ~ ^/melbourne/(pedestrian-counting-system-sensor-locations|on-street-parking-bays|parking-zones-linked-to-street-segments)\.parquet$ {
        set $melbourne data.melbourne.vic.gov.au;
        proxy_pass https://$melbourne/api/explore/v2.1/catalog/datasets/$1/exports/parquet$is_args$args;
        proxy_set_header Host $melbourne;
        proxy_cache melbourne;
        proxy_cache_key $request_uri;
        proxy_cache_valid 200 1d;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # The Internet's interconnection. PeeringDB's data centres, and the
    # submarine cables with their landing points, kept a day; while PeeringDB
    # answers 429 or fails, the last copy, however old (a register, not a
    # feed). RIPE Atlas: the anchors and their mesh measurements, by page of
    # 500, the most its API gives, kept a day; and the latest ping results of
    # one mesh, kept four minutes, the mesh's own interval.
    location ~ ^/peeringdb/(fac)$ {
        set $peeringdb www.peeringdb.com;
        proxy_pass https://$peeringdb/api/$1?depth=0&fields=id,name,org_name,city,country,region_continent,latitude,longitude,net_count,ix_count,carrier_count;
        proxy_set_header Host $peeringdb;
        proxy_cache interconnection;
        proxy_cache_valid 200 1d;
        # A refusal is kept too, so that a cold cache does not ask again on
        # every refresh: each ask restarts PeeringDB's hour.
        proxy_cache_valid 429 10m;
        proxy_cache_use_stale error timeout updating http_429 http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status always;
    }
    location ~ ^/cables/(cable|landing-point)\.json$ {
        set $cables www.submarinecablemap.com;
        proxy_pass https://$cables/api/v3/$1/$1-geo.json;
        proxy_set_header Host $cables;
        proxy_cache interconnection;
        proxy_cache_valid 200 1d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status always;
    }
    location ~ ^/atlas/anchors/([1-9])\.json$ {
        set $atlas atlas.ripe.net;
        proxy_pass https://$atlas/api/v2/anchors/?is_disabled=false&page_size=500&page=$1;
        proxy_set_header Host $atlas;
        proxy_cache interconnection;
        proxy_cache_valid 200 1d;
        add_header X-Cache-Status $upstream_cache_status always;
    }
    location ~ ^/atlas/mesh/([1-9])\.json$ {
        set $atlas atlas.ripe.net;
        proxy_pass https://$atlas/api/v2/measurements/?type=ping&af=4&status=2&description__startswith=Anchoring+Mesh&page_size=500&page=$1;
        proxy_set_header Host $atlas;
        proxy_cache interconnection;
        proxy_cache_valid 200 1d;
        add_header X-Cache-Status $upstream_cache_status always;
    }
    location ~ "^/atlas/latest/([0-9]{1,10})\.json$" {
        set $atlas atlas.ripe.net;
        proxy_pass https://$atlas/api/v2/measurements/$1/latest/;
        proxy_set_header Host $atlas;
        proxy_cache interconnection;
        proxy_cache_valid 200 4m;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # Starlink's orbital elements. Two hours, CelesTrak's own update interval:
    # one more ask in that time would be refused. While it fails, the last copy,
    # which a dashboard can still propagate for a day or two. With no copy yet,
    # a refusal is kept ten minutes, so that a cold cache does not ask again on
    # every refresh.
    location = /celestrak/starlink.csv {
        set $celestrak celestrak.org;
        proxy_pass https://$celestrak/NORAD/elements/gp.php?GROUP=starlink&FORMAT=csv;
        proxy_set_header Host $celestrak;
        proxy_cache celestrak;
        proxy_cache_valid 200 2h;
        proxy_cache_valid 403 10m;
        proxy_cache_use_stale error timeout updating http_403 http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # Fires and the grid. FIRMS's week of detections per satellite and region,
    # a fresh copy every ten minutes, as the satellites pass; the last one while
    # FIRMS fails.
    location ~ ^/firms/((?:noaa-20|noaa-21|suomi-npp)-viirs-c2)/((?:J1|J2|SUOMI)_VIIRS_C2_(?:South_America|Southern_Africa|Australia_NewZealand|USA_contiguous_and_Hawaii)_7d\.csv)$ {
        set $firms firms.modaps.eosdis.nasa.gov;
        proxy_pass https://$firms/data/active_fire/$1/csv/$2;
        proxy_set_header Host $firms;
        proxy_cache wildfires;
        proxy_cache_valid 200 10m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # Animal tracks. A versioned Zenodo record never changes, so its files,
    # gzipped CSV (INBO's gulls, one per year) or ZIP (the jaguars, read
    # inside the archive by GDAL, by ranges of the cached copy), are kept a
    # month, like figshare's. Zenodo gives up on a cold file after 30 s with a
    # 504 of its own, often on the first ask, less often on the second, as
    # though it had to fetch the file from further away: a 504 is asked again,
    # once, before the client sees it, and a fetch the client gave up on
    # carries on into the cache.
    location ~ ^/zenodo/records/([0-9]+)/files/([A-Za-z0-9_.-]+\.(?:csv\.gz|zip))$ {
        set $zenodo zenodo.org;
        set $zenodo_file api/records/$1/files/$2/content;
        proxy_pass https://$zenodo/$zenodo_file;
        proxy_set_header Host $zenodo;
        proxy_cache wildlife;
        proxy_cache_valid 200 30d;
        proxy_read_timeout 120s;
        proxy_ignore_client_abort on;
        proxy_intercept_errors on;
        error_page 502 504 = @zenodo_again;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    location @zenodo_again {
        proxy_pass https://$zenodo/$zenodo_file;
        proxy_set_header Host $zenodo;
        proxy_ignore_client_abort on;
        proxy_cache wildlife;
        proxy_cache_valid 200 30d;
        proxy_read_timeout 120s;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # TOPP, the Stanford Block Lab's tracks of 30 ocean species, 2002-2018: one
    # ERDDAP table of daily positions, about 256,000 of them and 18 MB, with no
    # header (csv0). ERDDAP builds it in about half a minute; the tagging ended
    # in 2018, so a month's cache. A fetch that outlives Grafana's patience
    # carries on, and concurrent misses wait for it, as for the GFS forecast.
    location = /atn/topp.csv {
        set $atn atn.ioos.us;
        proxy_pass https://$atn/erddap/tabledap/stanford_import_ssm_public.csv0?time,latitude,longitude,common_name,topp_id,taxon;
        proxy_set_header Host $atn;
        proxy_cache wildlife;
        proxy_cache_valid 200 30d;
        proxy_ignore_client_abort on;
        proxy_read_timeout 300s;
        proxy_cache_lock_timeout 300s;
        proxy_cache_lock_age 300s;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # Spain's mobility study (MITMA). A day of trips between municipalities,
    # 2022 onwards, and the municipalities themselves: names, population and
    # centroids. Published files that never change, kept a month; a day is
    # 80 MB and takes S3 a few seconds, so a fetch the client gave up on
    # carries on into the cache, and concurrent misses wait for it. The monthly
    # national totals grow by a month at a time: kept a day.
    location ~ "^/mitma/(estudios_basicos/por-municipios/viajes/ficheros-diarios/20[2-9][0-9]-[01][0-9]/20[2-9][0-9][01][0-9][0-3][0-9]_Viajes_municipios\.csv\.gz|zonificacion/zonificacion_municipios/(?:nombres_municipios\.csv|poblacion_municipios\.csv|zonificacion_municipios_centroides\.(?:shp|shx|dbf|prj)))$" {
        set $mitma mitma-movilidad-v2.s3.eu-west-1.amazonaws.com;
        proxy_pass https://$mitma/$1;
        proxy_set_header Host $mitma;
        proxy_cache mitma;
        proxy_cache_valid 200 30d;
        proxy_ignore_client_abort on;
        proxy_read_timeout 120s;
        proxy_cache_lock_timeout 120s;
        proxy_cache_lock_age 120s;
        add_header X-Cache-Status $upstream_cache_status always;
    }
    location = /mitma/estudios_basicos/movilidad_agregada_mensual/datos_agregados.csv {
        set $mitma mitma-movilidad-v2.s3.eu-west-1.amazonaws.com;
        proxy_pass https://$mitma/estudios_basicos/movilidad_agregada_mensual/datos_agregados.csv;
        proxy_set_header Host $mitma;
        proxy_cache mitma;
        proxy_cache_valid 200 1d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # OpenF1, by endpoint, query string and all: session, driver and time
    # window are in it. A session's data never changes once it is over, and the
    # dashboard offers only sessions over for hours: kept a month. The list of
    # a year's sessions grows as the season goes on: kept an hour. Upstream
    # through the throttle below; a fetch queued there carries on into the
    # cache if the client gives up.
    location ~ ^/openf1/v1/(drivers|laps|stints|pit|position|race_control|session_result|weather|overtakes|location|car_data)$ {
        proxy_pass http://127.0.0.1:8081/v1/$1$is_args$args;
        proxy_cache openf1;
        proxy_cache_key $request_uri;
        proxy_cache_valid 200 30d;
        # OpenF1 says "no results" with a 404; DuckDB would fail the whole
        # query on it. Handed on as an empty list, a lap without positions is
        # an empty map, not an error. Not kept: nginx would serve a kept 404
        # as it is, past error_page.
        proxy_intercept_errors on;
        error_page 404 = @openf1_none;
        proxy_ignore_client_abort on;
        proxy_read_timeout 180s;
        proxy_cache_lock_timeout 180s;
        proxy_cache_lock_age 180s;
        add_header X-Cache-Status $upstream_cache_status always;
    }
    location @openf1_none {
        default_type application/json;
        return 200 '[]';
    }
    location = /openf1/v1/sessions {
        proxy_pass http://127.0.0.1:8081/v1/sessions$is_args$args;
        proxy_cache openf1;
        proxy_cache_key $request_uri;
        proxy_cache_valid 200 1h;
        proxy_cache_use_stale error timeout updating http_429 http_500 http_502 http_503 http_504;
        proxy_read_timeout 180s;
        proxy_cache_lock_timeout 180s;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # The IOC's readings of one station and sensor from the start of a UTC day
    # (/ioc/data/<code>/<sensor>/<YYYY-MM-DD>.json). The key leaves the day
    # out: the copy of the day before holds that window and more, so at
    # midnight the visitor still gets it while the new day's is fetched. An
    # error with nothing kept is an empty list: one station down must not fail
    # the read of the other 359. Through the throttle below; a fetch carries on
    # into the cache if the client gives up.
    location ~ "^/ioc/data/([A-Za-z0-9_-]+)/([a-z0-9]+)/([0-9]{4}-[0-9]{2}-[0-9]{2})\.json$" {
        proxy_pass http://127.0.0.1:8082/service.php?query=data&format=json&code=$1&includesensors%5B%5D=$2&timestart=$3T00:00;
        proxy_cache ioc;
        proxy_cache_key /ioc/data/$1/$2;
        proxy_cache_valid 200 15m;
        proxy_cache_use_stale error timeout updating http_429 http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_intercept_errors on;
        error_page 404 429 500 502 503 504 = @ioc_none;
        proxy_ignore_client_abort on;
        proxy_read_timeout 120s;
        proxy_cache_lock_timeout 120s;
        add_header X-Cache-Status $upstream_cache_status always;
    }
    location @ioc_none {
        default_type application/json;
        return 200 '[]';
    }
    # The station list, with each sensor's last reading: the dashboard keeps
    # the stations heard from in the last day. Kept an hour.
    location = /ioc/stations.json {
        proxy_pass http://127.0.0.1:8082/service.php?query=stationlist&showall=all;
        proxy_cache ioc;
        proxy_cache_valid 200 1h;
        proxy_cache_use_stale error timeout updating http_429 http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_read_timeout 120s;
        proxy_cache_lock_timeout 120s;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # Impact Observatory's 10 m land cover, Esri's public ImageServer (no key):
    # the raw classes of one year over a box (exportImage, format=bsq), query
    # string and all, for land-cover-change. A published year does not change, so a
    # box once read is kept 30 days; the catalogue of years (query) a day, so a
    # new year shows the day after it lands. DuckDB's HEAD and GET of a miss
    # wait for one fetch.
    location = /lulc/exportImage {
        set $lulc ic.imagery1.arcgis.com;
        proxy_pass https://$lulc/arcgis/rest/services/Sentinel2_10m_LandCover/ImageServer/exportImage$is_args$args;
        proxy_set_header Host $lulc;
        proxy_cache lulc;
        proxy_cache_key $request_uri;
        proxy_cache_valid 200 30d;
        proxy_ignore_client_abort on;
        proxy_read_timeout 60s;
        proxy_cache_lock_timeout 60s;
        add_header X-Cache-Status $upstream_cache_status always;
    }
    location = /lulc/query {
        set $lulc ic.imagery1.arcgis.com;
        proxy_pass https://$lulc/arcgis/rest/services/Sentinel2_10m_LandCover/ImageServer/query$is_args$args;
        proxy_set_header Host $lulc;
        proxy_cache lulc;
        proxy_cache_key $request_uri;
        proxy_cache_valid 200 1d;
        proxy_cache_use_stale error timeout updating http_429 http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # GDACS's tropical cyclones (JRC, no key), for tropical-cyclones: the list
    # of events, one event's data (where its timeline id is), the timeline of
    # its advisories and the geometry of one episode (track, cone, wind radii).
    # GDACS takes 3 to 15 s to build each, and a dashboard reads the same ones
    # in five queries; an advisory comes every six hours, so a quarter of an
    # hour, keyed by the whole query string. GDACS goes slow or silent for
    # minutes at a time: past the quarter of an hour the old copy is served at
    # once while a new one is fetched behind it, and kept while GDACS is down.
    location ~ ^/gdacs/(events/geteventlist/SEARCH|events/geteventdata|export/gettimeline|polygons/getgeometry)$ {
        set $gdacs www.gdacs.org;
        proxy_pass https://$gdacs/gdacsapi/api/$1$is_args$args;
        proxy_set_header Host $gdacs;
        proxy_cache gdacs;
        proxy_cache_key $request_uri;
        proxy_cache_valid 200 15m;
        proxy_cache_use_stale error timeout updating http_429 http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_ignore_client_abort on;
        proxy_read_timeout 60s;
        proxy_cache_lock_timeout 60s;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # NCEI's IBTrACS best tracks, for tropical-cyclones: the last three seasons
    # (11.7 MB) and the storms active now. NCEI rewrites them a few times a
    # week, so six hours; past them the old copy is served while a new one is
    # fetched, and kept while NCEI is down.
    location ~ ^/ibtracs/(last3years|ACTIVE)\.csv$ {
        set $ncei www.ncei.noaa.gov;
        proxy_pass https://$ncei/data/international-best-track-archive-for-climate-stewardship-ibtracs/v04r01/access/csv/ibtracs.$1.list.v04r01.csv;
        proxy_set_header Host $ncei;
        proxy_cache gdacs;
        proxy_cache_key $uri;
        proxy_cache_valid 200 6h;
        proxy_cache_use_stale error timeout updating http_429 http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_ignore_client_abort on;
        proxy_read_timeout 120s;
        proxy_cache_lock_timeout 120s;
        add_header X-Cache-Status $upstream_cache_status always;
    }
}

# The IOC's throttle, as OpenF1's: ten requests a second, the rest wait in
# line (up to 500, more than one refresh of every station).
server {
    listen 127.0.0.1:8082;
    resolver 127.0.0.11 valid=300s ipv6=off;
    proxy_ssl_server_name on;

    location = /service.php {
        limit_req zone=ioc_upstream burst=500;
        set $ioc www.ioc-sealevelmonitoring.org;
        proxy_pass https://$ioc/service.php$is_args$args;
        proxy_set_header Host $ioc;
        proxy_set_header User-Agent "Pacha (+https://github.com/ubica-ecuador/pacha)";
        proxy_set_header Accept-Encoding gzip;
        gunzip on;
        proxy_read_timeout 60s;
    }
}

# OpenF1's throttle: only the feeds server above calls it, from inside this
# container. Requests past 25 a minute wait in line (up to 100 of them) rather
# than reaching OpenF1 and being refused. Asked for gzip, handed on plain.
server {
    listen 127.0.0.1:8081;
    resolver 127.0.0.11 valid=300s ipv6=off;
    proxy_ssl_server_name on;

    location /v1/ {
        limit_req zone=openf1_upstream burst=100;
        set $openf1 api.openf1.org;
        proxy_pass https://$openf1$request_uri;
        proxy_set_header Host $openf1;
        proxy_set_header User-Agent "Pacha (+https://github.com/ubica-ecuador/pacha)";
        proxy_set_header Accept-Encoding gzip;
        gunzip on;
        proxy_read_timeout 120s;
    }
}