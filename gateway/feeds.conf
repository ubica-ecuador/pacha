# `feeds`: the MBTA feeds behind gtfs-rt-mbta, cached. DuckDB in the grafana
# container calls http://feeds/mbta/..., and the gateway answers that name
# through a network alias.
#
# Every panel of that dashboard fetches a feed on every 30 s refresh, for every
# visitor, and MBTA's developer licence asks for no more than one request every
# 10 s. A 15 s cache makes the upstream rate independent of the audience.
#
# Also the European grid behind european-power-grid: Energy-Charts (Fraunhofer
# ISE) and the PyPSA-Eur network on Zenodo. Energy-Charts answers 503 to the
# Host header DuckDB sends (it carries the port); the proxy sends a plain one.
#
# And CMU's drone flights on figshare, whose redirect DuckDB cannot cache.
#
# And TriMet (Portland), behind trimet-live-fleet, whose every call needs an
# AppID in the query string. This is where it is added, so no dashboard carries
# it: not in git, and not in the query inspector of a public instance. It comes
# from TRIMET_APP_ID in .env; the nginx image runs envsubst over
# /etc/nginx/templates when the container starts, which is why this file is
# mounted there and not in conf.d. NGINX_ENVSUBST_FILTER limits it to
# TRIMET_*, so nginx's own variables stay as they are.
#
# And adsb.lol, behind air-traffic-world: every aircraft in the world in one
# answer, about 6,000 of them, 3.6 MB plain and 850 KB gzipped. A community
# service with no key; asked once a minute at most, whoever is looking, and the
# recorder (compose profile `recorder`) reads this same copy.
#
# And NOAA's GFS forecast on ERDDAP, behind gfs-wind-synoptic. ERDDAP builds
# every answer on the spot, in anything from 2 s to minutes, and DuckDB asks
# twice -- a HEAD, then the GET -- each built in full. The dashboard writes its
# time window into the URL from the clock, so one URL stands for three hours;
# cached here, ERDDAP is asked once per window, whoever is looking.
#
# And NYC's buildings and subway, behind nyc-skyline-plus, exported from a
# public GeoLens catalogue. The export is built per request, with a new ETag
# each time, so DuckDB's reads of one Parquet would abort with "the remote
# file has changed". Cached here, they all read the same file. It comes
# chunked, with no length, so nginx serves it whole, not by ranges; DuckDB
# then downloads it once, at most 4 MB.
#
# And the IMF's PortWatch and FRED, behind shipping-chokepoints-freight.
# PortWatch's daily transits are one 9 MB CSV, rebuilt once a week: cached, it
# is downloaded once a day, not once a visit. FRED refuses DuckDB, on its site
# and on its API alike (DuckDB's HEAD before the GET); through here it is one
# GET with the key from FRED_API_KEY in .env, added like TriMet's AppID.
#
# And Luchtmeetnet, the Dutch air quality network, behind
# air-quality-amsterdam: one request per station and pollutant, for whole
# hours, so every visitor in the same hour shares one copy.

proxy_cache_path /var/cache/nginx/mbta levels=1:2 keys_zone=mbta:10m
                 max_size=200m inactive=2h use_temp_path=off;
proxy_cache_path /var/cache/nginx/trimet levels=1:2 keys_zone=trimet:10m
                 max_size=200m inactive=2h use_temp_path=off;
map $args $trimet_args {
    ''      'appID=${TRIMET_APP_ID}';
    default 'appID=${TRIMET_APP_ID}&$args';
}
proxy_cache_path /var/cache/nginx/adsblol levels=1:2 keys_zone=adsblol:10m
                 max_size=100m inactive=1h use_temp_path=off;
proxy_cache_path /var/cache/nginx/grid levels=1:2 keys_zone=grid:10m
                 max_size=200m inactive=7d use_temp_path=off;
proxy_cache_path /var/cache/nginx/sensors levels=1:2 keys_zone=sensors:10m
                 max_size=500m inactive=30d use_temp_path=off;
proxy_cache_path /var/cache/nginx/erddap levels=1:2 keys_zone=erddap:10m
                 max_size=1g inactive=6h use_temp_path=off;
proxy_cache_path /var/cache/nginx/drones levels=1:2 keys_zone=drones:10m
                 max_size=500m inactive=30d use_temp_path=off;
proxy_cache_path /var/cache/nginx/geolens levels=1:2 keys_zone=geolens:10m
                 max_size=200m inactive=30d use_temp_path=off;
proxy_cache_path /var/cache/nginx/shipping levels=1:2 keys_zone=shipping:10m
                 max_size=100m inactive=7d use_temp_path=off;
proxy_cache_path /var/cache/nginx/luchtmeetnet levels=1:2 keys_zone=luchtmeetnet:10m
                 max_size=100m inactive=1d use_temp_path=off;

server {
    listen 80;
    server_name feeds;

    # Internal only. A request relayed by the public proxy also arrives from a
    # private address, but it carries X-Forwarded-For.
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;
    if ($http_x_forwarded_for) {
        return 403;
    }

    resolver 127.0.0.11 valid=300s ipv6=off;

    proxy_cache mbta;
    proxy_cache_key $uri;
    # Concurrent misses wait for one upstream fetch instead of each making one.
    proxy_cache_lock on;
    # No stale copies at all, not even while MBTA is failing: the dashboard
    # measures how fresh the feed is, and a stale copy would misreport exactly
    # that.
    proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
    proxy_hide_header Set-Cookie;
    proxy_ssl_server_name on;
    # The cache key ignores Accept-Encoding, so upstream must always answer
    # uncompressed; otherwise one gzip-accepting client would poison the entry.
    proxy_set_header Accept-Encoding "";
    # DuckDB reads Parquet with range requests; serve them from the cached file.
    proxy_force_ranges on;

    # Real-time feeds: VehiclePositions, TripUpdates and Alerts, as .pb or .json.
    location ~ ^/mbta/realtime/([A-Za-z_]+\.(json|pb))$ {
        set $mbta_rt cdn.mbta.com;
        proxy_pass https://$mbta_rt/realtime/$1;
        proxy_set_header Host $mbta_rt;
        proxy_cache_valid 200 15s;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # TriMet's web services, v2 and V1, with the AppID added. Always asked for
    # gzip, and stored that way: the trip status feed is 11 MB plain and 1 MB
    # gzipped. gunzip hands it plain to a client that does not ask for gzip,
    # as DuckDB's http_get does not. Kept 15 s: one fetch per dashboard
    # refresh, however many datasets and visitors ask. The key is the path and
    # query as the dashboard sent them, without the AppID.
    location ~ ^/trimet/(ws/(?:v2|V1)/[A-Za-z]+)$ {
        set $trimet developer.trimet.org;
        proxy_pass https://$trimet/$1?$trimet_args;
        proxy_set_header Host $trimet;
        proxy_set_header Accept-Encoding gzip;
        gunzip on;
        proxy_cache trimet;
        proxy_cache_key $request_uri;
        proxy_cache_valid 200 15s;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # adsb.lol: every aircraft in the world, the widest circle its API takes.
    # Asked for gzip and stored that way, like TriMet. A minute: the live panels
    # refresh at that pace, and the recorder polls on the minute.
    location = /adsblol/world {
        set $adsblol api.adsb.lol;
        proxy_pass https://$adsblol/v2/lat/0/lon/0/dist/20000;
        proxy_set_header Host $adsblol;
        proxy_set_header User-Agent "Pacha (+https://github.com/ubica-ecuador/pacha)";
        proxy_set_header Accept-Encoding gzip;
        gunzip on;
        proxy_cache adsblol;
        proxy_cache_valid 200 60s;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # LAMP performance archive: one Parquet per service day, rewritten during
    # the day and again a day or two later, so an hour is fresh enough.
    location ~ ^/mbta/lamp/([A-Za-z0-9_./-]+\.(parquet|csv))$ {
        set $mbta_lamp performancedata.mbta.com;
        proxy_pass https://$mbta_lamp/lamp/$1;
        proxy_set_header Host $mbta_lamp;
        proxy_cache_valid 200 1h;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # Energy-Charts: Germany's borders and the countries around it. The public
    # API allows 2 requests a minute per endpoint (a burst of 4; /signal 20),
    # so each endpoint is asked once a cache period, whatever the audience.
    # Its data comes in 15 min steps. The query string picks country and
    # days, so it is part of the key. No stale copies, as for MBTA: when a
    # reload fails, Chaski keeps the last good rows and says how old they are.
    location ~ ^/energy-charts/(v2/(cbpf|cbet|public_power|price|signal))$ {
        set $energy_charts api.energy-charts.info;
        proxy_pass https://$energy_charts/$1$is_args$args;
        proxy_set_header Host $energy_charts;
        proxy_cache grid;
        proxy_cache_key $request_uri;
        proxy_cache_valid 200 10m;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # Grid frequency, one reading a second: a minute's cache, within the limit.
    location = /energy-charts/v2/frequency {
        set $energy_charts api.energy-charts.info;
        proxy_pass https://$energy_charts/v2/frequency$is_args$args;
        proxy_set_header Host $energy_charts;
        proxy_cache grid;
        proxy_cache_key $request_uri;
        proxy_cache_valid 200 1m;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # PyPSA-Eur's prebuilt network: a versioned Zenodo record never changes.
    location ~ ^/zenodo/records/([0-9]+)/files/([A-Za-z0-9_.-]+\.csv)$ {
        set $zenodo zenodo.org;
        proxy_pass https://$zenodo/api/records/$1/files/$2/content;
        proxy_set_header Host $zenodo;
        proxy_cache grid;
        proxy_cache_valid 200 7d;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # CMU's package-delivery drone flights behind drone-delivery-flights, on
    # figshare (KiltHub). A file id never changes, so a month's cache. Figshare
    # answers with a redirect to an S3 link signed for 10 s: the gateway follows
    # it itself and stores the file under the figshare address ($uri), so the
    # next request is a HIT here and never sees the redirect.
    location ~ ^/figshare/files/([0-9]+)$ {
        set $figshare ndownloader.figshare.com;
        proxy_pass https://$figshare/files/$1;
        proxy_set_header Host $figshare;
        proxy_cache drones;
        proxy_cache_valid 200 30d;
        proxy_intercept_errors on;
        error_page 301 302 307 = @figshare_signed;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    location @figshare_signed {
        set $signed $upstream_http_location;
        proxy_pass $signed;
        proxy_cache drones;
        proxy_cache_valid 200 30d;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # ERDDAP griddap (PacIOOS's copy of NCEP GFS), query string and all: the
    # hours and the box are in it.
    location ^~ /erddap/ {
        set $erddap pae-paha.pacioos.hawaii.edu;
        # $request_uri as it arrived, still percent-encoded: ERDDAP wants its
        # brackets as %5B/%5D, and a decoded copy would not be the same URL.
        proxy_pass https://$erddap$request_uri;
        proxy_set_header Host $erddap;
        proxy_cache erddap;
        proxy_cache_key $request_uri;
        # A forecast step's values change only when a new run lands, every six
        # hours, and the dashboard's URLs move on every three anyway.
        proxy_cache_valid 200 3h;
        # A slow answer is still worth keeping: if Grafana gives up on it, the
        # fetch carries on and the next visitor finds it here.
        proxy_ignore_client_abort on;
        proxy_read_timeout 600s;
        # Concurrent misses -- DuckDB's HEAD and GET, two panels, two visitors --
        # wait for the one fetch in flight, for as long as ERDDAP can take,
        # rather than the default 5 s after which each goes upstream itself.
        proxy_cache_lock_timeout 600s;
        proxy_cache_lock_age 600s;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # Sensor.Community's archive behind air-quality: one CSV per sensor and
    # day, published the day after and never changed again, so a month's cache.
    # The dashboard's sparkline cards fetch a dozen sensors' days one by one
    # (about half a second each upstream); from the cache they are instant.
    # A 404 (no readings that day) is cached too, for an hour.
    location ~ "^/sensor-community/archive/([0-9]{4}-[0-9]{2}-[0-9]{2}/[A-Za-z0-9_.-]+\.csv)$" {
        set $sensor_archive archive.sensor.community;
        proxy_pass https://$sensor_archive/$1;
        proxy_set_header Host $sensor_archive;
        proxy_cache sensors;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1h;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # GeoLens dataset exports, by dataset id, as Parquet. The data behind an id
    # is a published snapshot, so a week's cache; a stranger's demo instance,
    # though, so not a month.
    location ~ "^/geolens/datasets/([0-9a-f-]{36})\.parquet$" {
        set $geolens datasets.geolibre.app;
        proxy_pass https://$geolens/api/datasets/$1/export?format=parquet;
        proxy_set_header Host $geolens;
        proxy_cache geolens;
        proxy_cache_valid 200 7d;
        proxy_read_timeout 120s;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # PortWatch datasets as CSV, by ArcGIS Hub item id, from the address the
    # Hub's download link redirects to. Rebuilt weekly, so a day's cache.
    location ~ "^/portwatch/items/([0-9a-f]{32})\.csv$" {
        set $arcgis_hub hub.arcgis.com;
        proxy_pass https://$arcgis_hub/api/v3/datasets/$1_0/downloads/data?format=csv&spatialRefId=4326&where=1%3D1;
        proxy_set_header Host $arcgis_hub;
        proxy_cache shipping;
        proxy_cache_valid 200 1d;
        proxy_read_timeout 120s;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # FRED series, observations as JSON, by series id. A BLS price index gains
    # one value a month, so a day's cache. The cache key is the path, without
    # the api_key, so the API key never reaches a cache entry or a dashboard.
    location ~ ^/fred/series/([A-Z0-9]+)$ {
        set $fred api.stlouisfed.org;
        proxy_pass https://$fred/fred/series/observations?series_id=$1&file_type=json&api_key=${FRED_API_KEY};
        proxy_set_header Host $fred;
        proxy_cache shipping;
        proxy_cache_valid 200 1d;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # Luchtmeetnet's hourly measurements, query string and all: station,
    # pollutant and hours are in it. The dashboard asks for whole hours, so a
    # URL stands for an hour; an hour's readings land within about an hour of
    # its end, so 10 minutes. Only a 200 is kept: past 7 days the API answers
    # with a redirect to a shorter span, which the dashboard never asks for.
    location = /luchtmeetnet/measurements {
        set $luchtmeetnet api.luchtmeetnet.nl;
        proxy_pass https://$luchtmeetnet/open_api/measurements$is_args$args;
        proxy_set_header Host $luchtmeetnet;
        proxy_cache luchtmeetnet;
        proxy_cache_key $request_uri;
        proxy_cache_valid 200 10m;
        add_header X-Cache-Status $upstream_cache_status always;
    }
}
