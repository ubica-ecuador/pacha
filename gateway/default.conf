# The stack's one published port: Grafana at /, the tiler at /titiler/.
#
# Upstreams are variables, resolved per request through Docker's DNS. A literal
# hostname in proxy_pass is resolved once at startup, and nginx refuses to start
# when it cannot be: with the tiler down, the gateway would take Grafana down
# with it.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Behind a TLS-terminating proxy (grafana.ubica.ec) keep the scheme it saw.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80 default_server;
    server_name _;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $grafana grafana:3000;
    set $titiler titiler:80;

    # A dashboard is saved as a single JSON body; nginx's default 1 MB is tight.
    client_max_body_size 20m;

    # Chaski's engine is a 34 MB WebAssembly file that every viewer downloads.
    # `gzip_proxied any` because behind a reverse proxy the requests carry Via,
    # and nginx would otherwise skip them. A response that arrives already
    # compressed passes through untouched.
    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/wasm application/javascript application/json text/css text/plain image/svg+xml;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;

    # The tiler serves from / (TITILER_API_ROOT_PATH only shapes the URLs it
    # writes), so the prefix comes off here.
    location /titiler/ {
        rewrite ^/titiler/(.*)$ /$1 break;
        proxy_pass http://$titiler;
        proxy_read_timeout 120s;
    }

    # Grafana Live runs over websockets. Setting a header here drops the
    # server-level ones, so all of them are repeated.
    location /api/live/ {
        proxy_pass http://$grafana;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location / {
        proxy_pass http://$grafana;
    }
}
