# Pacha: `docker compose up --wait`, then open
# http://localhost:3000 (or the STACK_PORT you set).
name: pacha

services:
  grafana:
    build:
      context: images/grafana
      args:
        # release: the pinned version in the Dockerfile. edge: main of the
        # Kepler repo, as its CI last published it. See .env.example.
        KEPLER_PANEL_CHANNEL: ${KEPLER_PANEL_CHANNEL:-release}
    image: ghcr.io/ubica-ecuador/pacha-grafana:${STACK_VERSION:-dev}
    # Applies the Git Sync repositories in provisioning/repositories/, then runs
    # the image's /run.sh. init reaps the script's background job.
    entrypoint: ['/etc/grafana/provisioning/repositories/start.sh']
    init: true
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      # Grafana Live checks a websocket's Origin against this before upgrading
      # it; left at Grafana's own default (port 3000) it rejects every browser
      # connecting through the gateway's real port. Set GF_SERVER_ROOT_URL
      # yourself when the stack is reached under another host (a reverse proxy,
      # a different machine name).
      GF_SERVER_ROOT_URL: ${GF_SERVER_ROOT_URL:-http://localhost:${STACK_PORT:-3000}/}
      # Git Sync: local repositories may only point under /var/lib/pacha.
      GF_PATHS_PERMITTED_PROVISIONING_PATHS: /var/lib/pacha
      GF_PROVISIONING_REPOSITORY_TYPES: 'local|github'
      # local: this clone's dashboards/, read-write (dev). github: main of the
      # repo on GitHub, which a public instance commits to. See .env.example.
      PACHA_REPO_TYPE: ${PACHA_REPO_TYPE:-local}
      PACHA_GIT_URL: ${PACHA_GIT_URL:-https://github.com/ubica-ecuador/pacha}
      PACHA_GIT_BRANCH: ${PACHA_GIT_BRANCH:-main}
      PACHA_GIT_TOKEN: ${PACHA_GIT_TOKEN:-}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning:ro
      # Read-write: Git Sync writes saves back here. See scripts/dev-acl.sh.
      - ./dashboards:/var/lib/pacha/dashboards
    networks:
      default:
        # The gateway's name for Grafana; see gateway/default.conf.
        aliases: [pacha-grafana]
    healthcheck:
      # Healthy once the Git Sync repositories are applied too (start.sh).
      test: ['CMD-SHELL', 'curl -fsS http://localhost:3000/api/health && test -f /tmp/pacha-repositories-applied']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  # Named `titiler` for good: DuckDB and Infinity queries call http://titiler/.
  titiler:
    build: images/titiler
    image: ghcr.io/ubica-ecuador/pacha-titiler:${STACK_VERSION:-dev}
    environment:
      TITILER_API_ROOT_PATH: /titiler
      # Public tiles, no credentials: any page may draw them.
      TITILER_API_CORS_ORIGINS: '*'
      # Reading a raster is CPU-bound and blocks a worker. With one, a dashboard
      # that draws a scene and measures it queued the statistics behind a dozen
      # tiles, into Grafana's 60 s timeout.
      WEB_CONCURRENCY: '4'
      # Hold GFS open from boot: opening it costs 4.6 s per worker, and DuckDB's
      # http_client gives up after 10 s. See icechunk_app.py.
      ICECHUNK_PRELOAD: 'stac+https://stac.dynamical.org/noaa-gfs-forecast/collection.json'
      # GDAL over /vsicurl: no directory listing per tile, merged ranges, header
      # caching. CPL_VSIL_CURL_ALLOWED_EXTENSIONS stays unset on purpose: it turns
      # "unexpected extension" into a silent failure.
      GDAL_DISABLE_READDIR_ON_OPEN: 'EMPTY_DIR'
      GDAL_HTTP_MERGE_CONSECUTIVE_RANGES: 'YES'
      GDAL_INGESTED_BYTES_AT_OPEN: '32768'
      GDAL_CACHEMAX: '200'
      GDAL_BAND_BLOCK_CACHE: 'HASHSET'
      VSI_CACHE: 'TRUE'
      VSI_CACHE_SIZE: '5000000'
    networks:
      default:
        # The gateway's name for the tiler. DuckDB keeps calling http://titiler/.
        aliases: [pacha-titiler]
    healthcheck:
      # Ready once the GFS preload has been tried (see /readyz).
      test: ['CMD', 'curl', '-fsS', 'http://localhost/readyz']
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s

  gateway:
    image: nginx:1.27-alpine
    ports:
      - '${STACK_PORT:-3000}:80'
    environment:
      # TriMet's AppID, from .env, written into feeds.conf at start. Unset, the
      # gateway still starts and every other feed works; only TriMet refuses.
      TRIMET_APP_ID: ${TRIMET_APP_ID:-}
      # FRED's API key, the same way; unset, only FRED refuses.
      FRED_API_KEY: ${FRED_API_KEY:-}
      NGINX_ENVSUBST_FILTER: '^(TRIMET|FRED)_'
    volumes:
      - ./gateway/default.conf:/etc/nginx/conf.d/default.conf:ro
      # A template: see the TriMet note at the top of feeds.conf.
      - ./gateway/feeds.conf:/etc/nginx/templates/feeds.conf.template:ro
      # What the recorder writes, served at http://feeds/recordings/; see
      # feeds.conf. Grafana's DuckDB cannot read local files.
      - recordings:/srv/recordings:ro
      # Served instead when nothing has been recorded: an empty recording.
      - ./gateway/recordings:/srv/fallback/recordings:ro
    networks:
      default:
        # DuckDB calls http://feeds/...; see gateway/feeds.conf.
        aliases: [feeds]
      # mcp reaches Grafana through here; see the mcp service.
      mcp: {}
    # Not on titiler: the gateway has to come up, and serve Grafana, without it.
    depends_on:
      grafana:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/api/health']
      interval: 5s
      timeout: 3s
      retries: 12

  # MCP server for AI agents that build dashboards (P4). Loopback only, behind
  # a bearer token: its tools write to Grafana. Never published on a public
  # instance.
  mcp:
    image: grafana/mcp-grafana:1.5.1
    command:
      - -t
      - streamable-http
      - --address
      - 0.0.0.0:8000
      # Host header allowlist (DNS-rebinding guard): how callers reach it.
      - --allowed-hosts
      - localhost:8000,127.0.0.1:8000
      # Replaces the default list: only what building dashboards needs.
      # runpanelquery is off by default upstream.
      - --enabled-tools
      - dashboard,datasource,search,runpanelquery
    environment:
      # Through the gateway, on a network of their own. mcp logs in as admin, and
      # the grafana container runs DuckDB, which anyone viewing a dashboard can
      # send SQL to: sharing no network with grafana, mcp is out of its reach.
      GRAFANA_URL: http://gateway
      GRAFANA_USERNAME: ${GF_SECURITY_ADMIN_USER:-admin}
      GRAFANA_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      # From the environment rather than a flag, so it stays out of `ps`.
      MCP_GRAFANA_SERVER_TOKEN: ${PACHA_MCP_TOKEN:-pacha-local}
    networks: [mcp]
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      gateway:
        condition: service_healthy

# docker buildx bake also reads this file; its parser needs the default network
# explicitly declared for the gateway's `feeds` alias.
networks:
  default: {}
  mcp: {}

volumes:
  grafana-data:
  recordings:
