# Grafana Geospatial Stack: `docker compose up --wait`, then open
# http://localhost:3000 (or the STACK_PORT you set).
name: geostack

services:
  grafana:
    build: images/grafana
    image: ghcr.io/ubica-ecuador/geostack-grafana:${STACK_VERSION:-dev}
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      # Grafana Live checks a websocket's Origin against this before upgrading
      # it; left at Grafana's own default (port 3000) it rejects every browser
      # connecting through the gateway's real port. Set GF_SERVER_ROOT_URL
      # yourself when the stack is reached under another host (a reverse proxy,
      # a different machine name).
      GF_SERVER_ROOT_URL: ${GF_SERVER_ROOT_URL:-http://localhost:${STACK_PORT:-3000}/}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/geostack/dashboards:ro
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:3000/api/health']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  # Named `titiler` for good: DuckDB and Infinity queries call http://titiler/.
  titiler:
    build: images/titiler
    image: ghcr.io/ubica-ecuador/geostack-titiler:${STACK_VERSION:-dev}
    environment:
      TITILER_API_ROOT_PATH: /titiler
      # Public tiles, no credentials: any page may draw them.
      TITILER_API_CORS_ORIGINS: '*'
      # Reading a raster is CPU-bound and blocks a worker. With one, a dashboard
      # that draws a scene and measures it queued the statistics behind a dozen
      # tiles, into Grafana's 60 s timeout.
      WEB_CONCURRENCY: '4'
      # Hold GFS open from boot: opening it costs 4.6 s per worker, and DuckDB's
      # http_client gives up after 10 s. See icechunk_app.py.
      ICECHUNK_PRELOAD: 'stac+https://stac.dynamical.org/noaa-gfs-forecast/collection.json'
      # GDAL over /vsicurl: no directory listing per tile, merged ranges, header
      # caching. CPL_VSIL_CURL_ALLOWED_EXTENSIONS stays unset on purpose: it turns
      # "unexpected extension" into a silent failure.
      GDAL_DISABLE_READDIR_ON_OPEN: 'EMPTY_DIR'
      GDAL_HTTP_MERGE_CONSECUTIVE_RANGES: 'YES'
      GDAL_INGESTED_BYTES_AT_OPEN: '32768'
      GDAL_CACHEMAX: '200'
      GDAL_BAND_BLOCK_CACHE: 'HASHSET'
      VSI_CACHE: 'TRUE'
      VSI_CACHE_SIZE: '5000000'
    healthcheck:
      # Ready once the GFS preload has been tried (see /readyz).
      test: ['CMD', 'curl', '-fsS', 'http://localhost/readyz']
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s

  gateway:
    image: nginx:1.27-alpine
    ports:
      - '${STACK_PORT:-3000}:80'
    volumes:
      - ./gateway/default.conf:/etc/nginx/conf.d/default.conf:ro
    # Not on titiler: the gateway has to come up, and serve Grafana, without it.
    depends_on:
      grafana:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/api/health']
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  grafana-data:
