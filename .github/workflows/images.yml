# The stack's images on GHCR, so that `docker compose up --wait` on a fresh
# clone pulls them instead of building them (or failing on a private name).
#
#   main      -> :dev (what compose.yaml runs by default) and :sha-<commit>
#   tag vX.Y.Z -> :X.Y.Z and :latest
#
# Each platform builds on a runner of its own architecture (no emulation: the
# Grafana image alone is 3 GB), pushes by digest, and a last job joins the two
# digests under the tags. Then the stack is started from those tags with no
# credentials, as a stranger would, so a package that is not public fails here.
name: Images

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - images/**
      - recorder/feeds/**
      - docker-bake.hcl
      - .github/workflows/images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/ubica-ecuador
  TARGETS: grafana titiler recorder

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      # Two images of 2-3 GB each and their build cache: more than the runner's
      # free disk once the preinstalled toolchains are counted.
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # docker-bake.hcl alone: the targets are complete there, and it pins the
      # release Kepler whatever compose.yaml's KEPLER_PANEL_CHANNEL says.
      - name: Build and push by digest
        id: bake
        uses: docker/bake-action@v6
        with:
          source: .
          files: ./docker-bake.hcl
          # A push by digest takes a bare name: the tags come in the next job.
          set: |
            *.platform=${{ matrix.platform }}
            *.output=type=image,push-by-digest=true,name-canonical=true,push=true
            grafana.tags=${{ env.REGISTRY }}/pacha-grafana
            titiler.tags=${{ env.REGISTRY }}/pacha-titiler
            recorder.tags=${{ env.REGISTRY }}/pacha-recorder

      - name: Keep the digests
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          mkdir -p digests
          for target in $TARGETS; do
            digest=$(printf '%s' "$METADATA" | jq -er --arg t "$target" '.[$t]["containerimage.digest"]')
            echo "$target ${{ matrix.arch }} $digest"
            echo "$digest" > "digests/$target-${{ matrix.arch }}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: digests/*
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tags.outputs.first }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          merge-multiple: true
          path: digests

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: tags
        run: |
          case $GITHUB_REF in
            refs/tags/v*) tags="${GITHUB_REF#refs/tags/v} latest" ;;
            *) tags="sha-${GITHUB_SHA::7} dev" ;;
          esac
          echo "all=$tags" >> "$GITHUB_OUTPUT"
          echo "first=${tags%% *}" >> "$GITHUB_OUTPUT"

      - name: Join the platforms under the tags
        env:
          TAGS: ${{ steps.tags.outputs.all }}
        run: |
          for target in $TARGETS; do
            image="$REGISTRY/pacha-$target"
            args=
            for tag in $TAGS; do args="$args -t $image:$tag"; done
            # shellcheck disable=SC2086
            docker buildx imagetools create $args \
              "$image@$(cat "digests/$target-amd64")" \
              "$image@$(cat "digests/$target-arm64")"
            docker buildx imagetools inspect "$image:${TAGS%% *}"
          done

  # What the README promises: a clone, `docker compose up --wait`, a working
  # Grafana. No login on purpose.
  smoke:
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true

      - uses: actions/checkout@v4

      - name: Start the stack from the published images
        env:
          STACK_VERSION: ${{ needs.publish.outputs.tag }}
        run: |
          if ! docker compose pull --quiet grafana titiler; then
            echo "::error::Pulling without credentials failed: make the pacha-grafana, pacha-titiler and pacha-recorder packages public (GitHub > ubica-ecuador > Packages > each one > Package settings > Change visibility)."
            exit 1
          fi
          docker compose up --wait --wait-timeout 600 --no-build

      - name: Grafana answers, with its dashboards
        run: |
          curl -fsS http://127.0.0.1:3000/api/health
          count=$(curl -fsS 'http://127.0.0.1:3000/api/search?type=dash-db&limit=5000' | jq length)
          echo "dashboards: $count"
          test "$count" -gt 10
          curl -fsS -o /dev/null http://127.0.0.1:3000/api/dashboards/uid/home

      - name: Logs
        if: failure()
        run: docker compose logs --tail 200

      - name: Stop
        if: always()
        run: docker compose down --volumes
