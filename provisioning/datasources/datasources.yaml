apiVersion: 1

datasources:
  # DuckDB on the server. `path` blank means an in-memory database, which is all
  # reading remote files needs. The extensions are baked into the image, under
  # /opt/geostack/duckdb-home/.duckdb/extensions — but Grafana 13.2.1 always
  # launches a backend plugin's subprocess with HOME pinned to GF_PATHS_HOME
  # (/usr/share/grafana), never the image's own HOME, so the plugin process
  # never sees where they were baked. The leading `SET extension_directory=...`
  # names that path explicitly; the LOADs below then read the files already on
  # disk and never go online.
  #
  # Every extension a dashboard may use is loaded here: once the local
  # filesystem is off (below), nothing else can be loaded. `http_client`
  # (community) carries the STAC search and the tiler's statistics:
  # `http_get`/`http_post` are scalars, so their URLs and bodies can be built
  # from $__timeFrom(), $__timeTo() and variables.
  #
  # The external file cache is off. It keeps remote files in memory keyed by
  # URL, and a file replaced while several queries read it (the MBTA feeds change
  # every 15 s) reached a query as a mix of both versions: "Malformed JSON", about
  # one query in 800. The setting is instance-wide, hence here.
  #
  # Last, the local filesystem goes off. Anyone who may view a dashboard can
  # send this datasource SQL of their own, anonymous visitors included, and
  # DuckDB runs inside the grafana container: without this, a query could read
  # /var/lib/grafana/grafana.db. DuckDB refuses to turn it back on, so a query
  # cannot undo it. The price: dashboards cannot INSTALL or LOAD an extension
  # that is not loaded here, nor read local files — the data is remote anyway.
  #
  # Persistent secrets go off at the very start. The secret manager looks for
  # them on disk the first time it is used, which with the disk off fails every
  # remote read; and it refuses the setting once anything has used it, which
  # LOAD http_client does.
  - name: DuckDB
    type: motherduck-duckdb-datasource
    uid: duckdb
    jsonData:
      path: ''
      initSql: "SET extension_directory='/opt/geostack/duckdb-home/.duckdb/extensions'; SET allow_persistent_secrets = false; LOAD httpfs; LOAD spatial; LOAD json; LOAD excel; LOAD raster; LOAD http_client; SET enable_external_file_cache = false; SET disabled_filesystems = 'LocalFileSystem';"

  - name: Infinity
    type: yesoreyeram-infinity-datasource
    uid: infinity
    jsonData: {}

  # Chaski: DuckDB in each viewer's browser. Deliberately without a URL. That URL
  # is what $__proxy reads through, and whoever may query the datasource (on a
  # public instance, any anonymous visitor) could read anywhere on that server,
  # with its stored credentials. What the browser reads must allow CORS, or
  # arrive as a dataset from DuckDB or Infinity above.
  - name: Chaski
    type: ubica-chaski-datasource
    uid: duckdbwasm
    access: proxy
    jsonData:
      memoryLimitMB: 1024
